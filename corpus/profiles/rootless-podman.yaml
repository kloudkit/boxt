schema: "1.0"
id: rootless-podman
version: provisional
controls:
  - id: run-as-non-root
    behaviours: [ { behaviour: needs-root, tier: ready_with_config } ]
  - id: no-privilege-escalation
    behaviours: [ { behaviour: setuid, tier: ready_with_config } ]
  - id: unprivileged-ports
    behaviours: [ { behaviour: low-port, tier: ready_with_config } ]
  - id: linux-runtime
    behaviours: [ { behaviour: registry, tier: needs_windows } ]
