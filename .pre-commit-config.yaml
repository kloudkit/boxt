---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=300
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.39.0
    hooks:
      - id: check-jsonschema
        name: check rules against the rule schema
        files: ^(corpus/rules/.*|crates/boxt-rules/tests/corpora/(valid|user)/rules/.*)\.yaml$
        args:
          - --schemafile
          - corpus/schema/rule-v1.0.schema.json
