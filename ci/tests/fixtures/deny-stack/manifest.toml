[package]
name = "fixture"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bzip2 = "=0.6.1"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
lzma-rust2 = "=0.21.0"
rpm = { version = "=0.30.2", default-features = false, features = ["payload", "gzip-compression", "bzip2-compression"] }
ruzstd = "=0.9.1"
tree-sitter = "=0.27.1"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "xz"] }
