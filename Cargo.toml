[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
encoding_rs = "=0.8.42"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
tar = { version = "=0.4.46", default-features = false }
globset = { version = "=0.4.20", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process", "fs"] }
tree-sitter = "=0.27.1"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
panic = "unwind"
